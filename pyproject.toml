[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "google-health-mcp"
version = "0.1.0"
description = "Private, read-only Google Health MCP with per-user credentials and usage statistics"
requires-python = ">=3.11"
dependencies = ["mcp>=1.30,<2", "httpx>=0.28,<0.29", "python-dotenv>=1.2,<2", "uvicorn>=0.31,<1", "cryptography>=47,<51"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.16,<1"]

[project.scripts]
google-health-mcp = "health_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
health_mcp = ["catalog.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
