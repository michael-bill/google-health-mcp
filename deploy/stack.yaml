version: "3.8"
services:
  mcp:
    image: google-health-mcp:${HEALTH_RELEASE:-2026-11-13}
    environment:
      AUTH_MODE: oauth
      PUBLIC_BASE_URL: https://${HEALTH_DOMAIN:?Set HEALTH_DOMAIN}
      TOKEN_KEY_FILE: /run/secrets/token-keys.json
      GOOGLE_CLIENT_SECRETS_FILE: /run/secrets/google-client.json
      SQLITE_PATH: /app/data/health.sqlite3
      EXPORT_DIR: /app/data/exports
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8767"
      MCP_ALLOWED_HOSTS: ${HEALTH_DOMAIN:?Set HEALTH_DOMAIN},localhost:*,127.0.0.1:*
      MCP_ALLOWED_ORIGINS: https://${HEALTH_DOMAIN:?Set HEALTH_DOMAIN}
    volumes:
      - /etc/google-health-mcp:/run/secrets:ro
      - /var/lib/google-health-mcp:/app/data
    read_only: true
    cap_drop: [ALL]
    networks: [health-backend]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8767/healthz', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
          cpus: "0.50"
      update_config:
        order: stop-first
        failure_action: rollback
    logging:
      driver: local
      options: {max-size: 10m, max-file: "3"}
networks:
  health-backend:
    external: true
    name: health-backend
